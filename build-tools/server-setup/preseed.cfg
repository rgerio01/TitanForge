# ============================================================================
# preseed.cfg — instalacao Debian 12 totalmente automatica (headless, R210)
# Usado embutido na ISO: kernel cmdline = auto=true priority=critical
#                        preseed/file=/cdrom/preseed.cfg
# O build-iso.py substitui __USERPWHASH__ pelo hash da senha do usuario.
# ============================================================================

### Localizacao
d-i debian-installer/locale        string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8, pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Rede (DHCP; IP fixo definido depois, por SSH ou reserva no roteador)
d-i netcfg/choose_interface       select auto
d-i netcfg/get_hostname           string titanforge-srv
d-i netcfg/get_domain             string lan
d-i netcfg/hostname               string titanforge-srv
d-i netcfg/wireless_wep           string
d-i hw-detect/load_firmware       boolean true

### Espelho
d-i mirror/country                string manual
d-i mirror/http/hostname          string deb.debian.org
d-i mirror/http/directory         string /debian
d-i mirror/http/proxy             string

### Relogio
d-i clock-setup/utc               boolean true
d-i time/zone                     string America/Sao_Paulo
d-i clock-setup/ntp               boolean true

### Contas — root travado, usuario 'rogerio' com sudo
d-i passwd/root-login             boolean false
d-i passwd/make-user              boolean true
d-i passwd/user-fullname          string Rogerio
d-i passwd/username               string rogerio
d-i passwd/user-password-crypted  password __USERPWHASH__
d-i passwd/user-default-groups    string audio cdrom video plugdev netdev sudo
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home       boolean false

### Particionamento — 1o disco FIXO (ignora pendrive/removivel), tudo numa
### particao (OS). Dados/ROMs no 2o disco sao configurados depois por SSH.
d-i partman/early_command string \
  D=""; \
  for d in $(list-devices disk); do \
    b=$(basename "$d"); \
    r=$(cat /sys/block/$b/removable 2>/dev/null || echo 0); \
    [ "$r" = 0 ] || continue; \
    D="$d"; break; \
  done; \
  [ -n "$D" ] || D=$(list-devices disk | head -n1); \
  logger -t preseed "disco alvo: $D"; \
  dd if=/dev/zero of="$D" bs=1M count=16 2>/dev/null || true; \
  debconf-set partman-auto/disk "$D"; \
  debconf-set grub-installer/bootdev "$D"
d-i partman-auto/method           string regular
d-i partman-auto/choose_recipe    select atomic
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md   boolean true
d-i partman/unmount_active        boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition      select finish
d-i partman/confirm               boolean true
d-i partman/confirm_nooverwrite   boolean true
d-i partman-md/confirm            boolean true
d-i partman-lvm/confirm           boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

### Base
d-i base-installer/install-recommends boolean false
d-i apt-setup/non-free-firmware   boolean true
d-i apt-setup/non-free            boolean false
d-i apt-setup/contrib             boolean false
d-i apt-setup/services-select     multiselect security, updates
d-i apt-setup/security_host       string security.debian.org

### Pacotes
tasksel tasksel/first             multiselect standard, ssh-server
d-i pkgsel/include                string sudo curl wget ca-certificates gnupg openssh-server rsync
d-i pkgsel/upgrade                select full-upgrade
popularity-contest popularity-contest/participate boolean false

### GRUB
d-i grub-installer/only_debian    boolean true
d-i grub-installer/with_other_os  boolean true
# grub-installer/bootdev vem do early_command (o mesmo disco fixo $D)

### Finalizacao — dispara provisionamento no 1o boot e reinicia
d-i preseed/late_command string \
  cp /cdrom/preseed.cfg /target/root/preseed.cfg 2>/dev/null || true; \
  cp /cdrom/provision-debian.sh /target/root/provision-debian.sh; \
  cp /cdrom/firstboot.sh /target/root/firstboot.sh; \
  chmod +x /target/root/provision-debian.sh /target/root/firstboot.sh; \
  printf '%s\n' \
    '[Unit]' \
    'Description=TitanForge first-boot provisioning' \
    'After=network-online.target' \
    'Wants=network-online.target' \
    'ConditionPathExists=/root/firstboot.sh' \
    '[Service]' \
    'Type=oneshot' \
    'ExecStart=/root/firstboot.sh' \
    'RemainAfterExit=yes' \
    'StandardOutput=append:/var/log/titanforge-firstboot.log' \
    'StandardError=append:/var/log/titanforge-firstboot.log' \
    '[Install]' \
    'WantedBy=multi-user.target' \
    > /target/etc/systemd/system/tf-firstboot.service; \
  in-target systemctl enable tf-firstboot.service; \
  in-target systemctl enable ssh

d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false
